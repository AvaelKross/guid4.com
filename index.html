        <style>
            body {    background-color: #ffebe4;}
            h1 {     font-family: "Sankofa Display", sans-serif;
    color: honeydew;}
            #guid {    margin-left: 10px;
    width: 300px;}

            }

    <body>
        <div class="centered-block">
            <h1>GUID4.com</h1>
            <div>
                <button id="button" onclick="makeGood()">Generate new GUID!</button><input id="guid" disabled></input>
                <button id="copy" onclick="copy()">Copy to Clipboard</button>
            </div>
            <div style="margin-top: 20px">Click the button above to generate new UUID v.4 (also known as GUID).</div>
        <div>
        <script>
            function uuidv4() {
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
  );
}
            makeGood = function() {
                document.getElementById("guid").value =uuidv4();
            }

            copy = function() {
                var copyText = document.getElementById("guid");

  // Select the text field
  copyText.select();
  copyText.setSelectionRange(0, 99999); // For mobile devices

   // Copy the text inside the text field
  navigator.clipboard.writeText(copyText.value);
            }
            makeGood();
        </script>
